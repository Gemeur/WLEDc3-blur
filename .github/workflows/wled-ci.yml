name: WLED CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build_custom_wled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove dev warning banner and rebuild Web UI
        run: |
          sed -i 's/⚠ DEVELOPMENT BUILD — WORK IN PROGRESS — NOT FOR PRODUCTION USE//g' wled00/data/*.htm wled00/html_*.h || true
          sed -i 's/id="dev-warn"/style="display:none!important" id="dev-warn"/g' wled00/data/*.htm wled00/html_*.h || true
          npm install
          npm run build || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build esp32c3dev
        run: pio run -e esp32c3dev

      - name: Prepare clean .bin files
        run: |
          cp .pio/build/esp32c3dev/firmware.bin WLED_0.16.0_ESP32-C3_OTA.bin

      - name: Create or update Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v0.16.0-blur
          git push origin v0.16.0-blur --force

      - name: Publish direct .bin to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.16.0-blur
          name: "WLED 0.16.0 ESP32-C3 (Blur + AudioReactive)"
          body: "Чистый .bin без плашки DEVELOPMENT BUILD и с многопроходным размытием."
          files: WLED_0.16.0_ESP32-C3_OTA.bin
          prerelease: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
